# Dependabot version updates. Security updates are enabled separately in repo settings
# (the apply-github-settings.sh script does that).
# Keep only the ecosystem blocks whose manifest actually exists in the repo.
version: 2
updates:
  # Keeps every GitHub Action referenced in .github/workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies", "github-actions"]

