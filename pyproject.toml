[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "u3-ingest"
version = "0.1.0"
description = "Low-latency ingestion for sportsbook and prediction-market feeds (OpticOdds v3, OddsPapi v5, SharpSports)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "websockets>=13",
  "orjson>=3.10",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "structlog>=24",
  "prometheus-client>=0.20",
  "zstandard>=0.22",
  "msgpack>=1.0",
]

[project.optional-dependencies]
clickhouse = ["clickhouse-connect>=0.7"]
gcs = ["google-cloud-storage>=2.16"]
research = ["pyarrow>=17", "duckdb>=1.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "uvloop>=0.19"]

[project.scripts]
u3-ingest = "u3ingest.cli:main"

[tool.setuptools.packages.find]
include = ["u3ingest*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "ASYNC230", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"u3ingest/cli.py" = ["E702"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
